<form
  tuiAppearance="floating"
  tuiCardLarge
  tuiForm="l"
  [formGroup]="form"
  (ngSubmit)="submit()"
  [style.max-width.rem]="38"
  tuiAnimated
>
  <header tuiHeader>
    <h2 tuiTitle>
      New Listing
      <span tuiSubtitle>Add your space</span>
    </h2>
  </header>
{{this.form.controls.userType.value}}
  <!-- group -->
  <label tuiLabel>Who are You?</label>
  <div
  tuiGroup>

    <label tuiBlock>
      <span tuiTitle>
        {{this.block[0]}}
        <span tuiSubtitle>
          Post snd repost listings to find a roommate
        </span>
        <input type="radio" [value]='block[0]' tuiRadio formControlName="userType"/>
      </span>
    </label>

    <label tuiBlock>
      <span tuiTitle>
        {{this.block[1]}}
        <span tuiSubtitle>
          Post snd repost listings to find a roommate
        </span>
        <input type="radio" [value]='block[1]' tuiRadio formControlName="userType"/>
      </span>
    </label>

    <label tuiBlock>
      <span tuiTitle>
        {{this.block[2]}}
        <span tuiSubtitle>
          Post snd repost listings to find a roommate
        </span>
        <input type="radio" [value]='block[2]' tuiRadio formControlName="userType"/>
      </span>
    </label>

    <label tuiBlock appearance="warning">
      <span tuiTitle>
        {{this.block[3]}}
        <span tuiSubtitle>
          Post snd repost listings to find a roommate
        </span>
        <input type="radio" [value]='block[3]' tuiRadio formControlName="userType"/>
        <tui-error [formControl]="form.controls['userType']" [error]="['required','maxlength'] | tuiFieldError | async" />
      </span>
    </label>
  </div>

  <!-- house type -->
   <label tuiLabel>House Type</label>
  <div tuiItemGroup>
    <tui-items-with-more
    class="container"
    [class.container_expanded]="linesLimit === 100"
    [linesLimit]="linesLimit"
    (lastIndexChange)="lastIndex = $event"
     >
      @for(chip of chips;let i=$index;track i ){
        <ng-container>
          <label
          tuiChip
          size="xs"
          *tuiItem
          [appearance]="chip? 'info':'negative'"
          [class.item_visible]="i <= lastIndex"

          >
            {{chip}}
            <input
            type="radio"
            [value]="chip"
            formControlName="houseType"
            size="xs"
            appearance="info"
            name="houseType"
            tuiChip>
          </label>
          <tui-error [formControl]="form.controls['houseType']" [error]="['required','maxlength'] | tuiFieldError | async" />
        </ng-container>

          <ng-template
          let-index
          tuiMore>
          <button
          type="button"
          tuiChip
          iconEnd="@tui.chevron-down"
          appearance="icon"
          (click)="linesLimit=10">
            + {{getRemaining(index)}}
          </button>
          </ng-template>
      }
    </tui-items-with-more>
  </div>
  <!-- house type alt -->
  @if(form.value.houseType===chips[chips.length-1]){
    <tui-textfield>
      <label tuiLabel>House Type</label>
      <input tuiTextfield formControlName="customHouseType" placeholder="e.g. Custom house type" />
    </tui-textfield>
    <tui-error [formControl]="form.controls['customHouseType']" [error]="['required','maxlength'] | tuiFieldError | async" />
  }



  <!-- title -->
  <tui-textfield>
    <label tuiLabel>Listing Title</label>
    <input tuiTextfield formControlName="title" placeholder="e.g. Cozy Student Room in Nairobi" />
  </tui-textfield>
  <tui-error [formControl]="form.controls['title']" [error]="['required','maxlength'] | tuiFieldError | async" />

  <!-- descr -->

  <tui-textfield>
    <label tuiLabel>House Description</label>
    <textarea tuiTextarea formControlName="description" placeholder="Describe the property" [max]=4 [min]=4></textarea>
  </tui-textfield>
  <tui-error [formControl]="form.controls['description']" [error]="['required','maxlength'] | tuiFieldError | async" />

  <!-- price -->
  <tui-textfield>
    <label tuiLabel>Price ({{+(254|tuiCurrency)}})</label>
    <input  tuiTextfield type="number" formControlName="price" placeholder="2500" />
  </tui-textfield>
  <tui-error [formControl]="form.controls['price']" [error]="['required','min'] | tuiFieldError | async" />

  <tui-textfield>
    <label tuiLabel>City</label>
    <input tuiTextfield formControlName="city" placeholder="e.g. Nairobi" />
  </tui-textfield>
  <tui-error [formControl]="form.controls['city']" [error]="['required'] | tuiFieldError | async" />

  <app-image-upload [control]="form.controls['images']" accept="image/*"  label="Upload room images"></app-image-upload>

  <footer class="tui-space_top-3">
    <button appearance="secondary" tuiButton type="button" routerLink="/housing">Cancel</button>
    <button tuiButton type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Posting...' : 'Post Listing' }}
    </button>
  </footer>
</form>
