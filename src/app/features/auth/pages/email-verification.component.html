<!-- Loader with overlay while verifying -->
@if (loading) {
  <tui-loader [showLoader]="loading" size="l" [overlay]="true">
    Verifying your email...
  </tui-loader>
}

<!-- Success notification -->
@if (!loading && success) {
  <tui-notification appearance="success" class="message-box">
    Your email has been verified successfully!
    <br /><br />
    <button tuiButton appearance="primary" size="m" (click)="goToLogin()">Go to Login</button>
  </tui-notification>
}

<!-- Informational notification (no token, just redirected) -->
@if (!loading && !success && !error) {
  <tui-notification appearance="info" class="message-box">
    Registration successful. Please check your email and click the verification link we sent you.
  </tui-notification>
}

<!-- Error notification -->
@if (!loading && error) {
  <tui-notification appearance="error" class="message-box">
    {{ error }}
  </tui-notification>
}
