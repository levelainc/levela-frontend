<label tuiInputFiles>
  <input
    tuiInputFiles
    [formControl]="control"
    [multiple]="true"
    accept="image/*"
    (reject)="onReject($event)"
  />
  {{ label }}
</label>

<tui-files class="tui-space_top-1">
  <tui-file *ngFor="let file of accepted$ | async" [file]="file" (remove)="onRemove(file)" />
  <tui-file *ngFor="let file of rejected" state="error" [file]="file" (remove)="onRemove(file)" />
</tui-files>
